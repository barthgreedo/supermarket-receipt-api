name: "CI"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: "${{ matrix.check }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: "Lint"
            command: "uv run ruff check ."
          - check: "Format"
            command: "uv run ruff format --check ."
          - check: "Tests"
            command: "uv run pytest tests -v --cov=supermarket_receipt_api.checkout --cov-report=term-missing"
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Préparer l'environnement"
        uses: "./.github/actions/preparer"

      - name: "${{ matrix.check }}"
        run: "${{ matrix.command }}"

  build:
    name: "Build"
    needs: "checks"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Préparer l'environnement"
        uses: "./.github/actions/preparer"

      - name: "Construire le paquet"
        run: "uv build"
