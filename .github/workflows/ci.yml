name: "CI"

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: "read"

jobs:
  ci:
    name: "${{ matrix.check }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: "Lint"
            command: "uv run ruff check ."
          - check: "Format"
            command: "uv run ruff format --check ."
          - check: "Tests"
            command: "uv run pytest tests -v --cov=supermarket_receipt_api.checkout --cov-report=term-missing"
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - name: "Installer Python et uv"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          python-version: "3.13"
          enable-cache: false

      - name: "Installer les dépendances"
        run: "uv sync --locked"

      - name: "${{ matrix.check }}"
        run: "${{ matrix.command }}"
